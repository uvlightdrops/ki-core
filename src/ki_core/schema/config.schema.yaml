$schema: "http://json-schema.org/draft-07/schema#"
title: "ki-core Base Configuration"
description: "Generic, app-agnostic base schema for the ki ecosystem. Only sections that are truly shared across all apps belong here - app-specific config lives in each app's own schema (e.g. kicli-code-assist/schema/kicli.schema.yaml, ki-knowledge/schema/ki_knowledge.schema.yaml)."
type: object
properties:
  llm:
    type: object
    title: "LLM Provider Settings"
    properties:
      default_provider:
        type: string
        default: "mock"
        description: "Default LLM provider to use when not explicitly selected"
      providers:
        type: object
        properties:
          ki:
            type: object
            properties:
              base_url:
                type: string
                default: ""
              api_key:
                type: string
                default: ""
              model:
                type: string
                default: "google/gemma-4-26B-A4B-it"
              endpoint:
                type: string
                default: ""
            additionalProperties: true
          openai:
            type: object
            properties:
              base_url:
                type: string
                default: "https://api.openai.com/v1"
              api_key:
                type: string
                default: ""
              model:
                type: string
                default: "gpt-4"
            additionalProperties: true
          ollama:
            type: object
            properties:
              base_url:
                type: string
                default: "http://localhost:11434"
              model:
                type: string
                default: "llama3.2"
            additionalProperties: true
        additionalProperties: true
    additionalProperties: true
  http:
    type: object
    title: "HTTP Client Settings"
    properties:
      request_timeout:
        type: integer
        default: 30
      verify_ssl:
        type: boolean
        default: true
    additionalProperties: true
  creds:
    type: object
    description: "Optional separate credentials overlay (creds.yaml), deep-merged over the resolved config."
    additionalProperties: true
  apps:
    type: object
    description: "Namespace for app-specific configuration. Each app defines its own sub-schema (e.g. apps.kicli.*, apps.ki_knowledge.*) in its own schema file, merged on top of this base schema."
    additionalProperties: true
additionalProperties: true
